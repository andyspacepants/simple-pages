<!DOCTYPE html>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; overflow: hidden; height: 100vh; }
  .toolbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #fff; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar h1 { font-size: 1.1em; margin-right: auto; }
  .toolbar button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.9em; }
  .toolbar button:hover { background: #eee; }
  .toolbar button:active { background: #ddd; }
  #svg-container { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #svg-container.dragging { cursor: grabbing; }
  .room-label { font-family: 'Segoe UI', sans-serif; pointer-events: none; }
  .room:hover { opacity: 0.8; cursor: pointer; }
  .legend { position: fixed; bottom: 12px; left: 12px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.12); font-size: 0.8em; z-index: 10; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-swatch { width: 16px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.2); }
  .instructions { position: fixed; bottom: 12px; right: 12px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 10px 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.12); font-size: 0.78em; color: #666; z-index: 10; }
</style>
</head>

<div class="instructions">
  Scroll to zoom &middot; Drag to pan &middot; Pinch to zoom on mobile
</div>

<script>
const container = document.getElementById('svg-container');
const svg = document.getElementById('map');
let scale = 1;
let panX = 0, panY = 0;
let isDragging = false;
let startX, startY;
let lastTouchDist = 0;

function updateTransform() {
  svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  svg.style.transformOrigin = '0 0';
}

function zoomIn() {
  scale = Math.min(scale * 1.3, 8);
  updateTransform();
}

function zoomOut() {
  scale = Math.max(scale / 1.3, 0.3);
  updateTransform();
}

function resetView() {
  scale = 1;
  panX = 0;
  panY = 0;
  updateTransform();
}

// Mouse wheel zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const oldScale = scale;
  if (e.deltaY < 0) {
    scale = Math.min(scale * 1.15, 8);
  } else {
    scale = Math.max(scale / 1.15, 0.3);
  }

  // Zoom toward mouse position
  panX = mouseX - (mouseX - panX) * (scale / oldScale);
  panY = mouseY - (mouseY - panY) * (scale / oldScale);
  updateTransform();
}, { passive: false });

// Mouse drag
container.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  container.classList.add('dragging');
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  updateTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  container.classList.remove('dragging');
});

// Touch support
container.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: false });

container.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    panX = e.touches[0].clientX - startX;
    panY = e.touches[0].clientY - startY;
    updateTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const factor = dist / lastTouchDist;
    scale = Math.min(Math.max(scale * factor, 0.3), 8);
    lastTouchDist = dist;
    updateTransform();
  }
}, { passive: false });

container.addEventListener('touchend', () => {
  isDragging = false;
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-') zoomOut();
  if (e.key === '0') resetView();
});

// Initial fit
function fitToScreen() {
  const rect = container.getBoundingClientRect();
  const scaleX = rect.width / 1200;
  const scaleY = rect.height / 800;
  scale = Math.min(scaleX, scaleY) * 0.95;
  panX = (rect.width - 1200 * scale) / 2;
  panY = (rect.height - 800 * scale) / 2;
  updateTransform();
}
fitToScreen();
window.addEventListener('resize', fitToScreen);
</script>
</body>
</html>
